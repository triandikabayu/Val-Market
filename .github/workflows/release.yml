name: Release

# Builds installers for macOS (Apple Silicon + Intel), Windows, Linux,
# and an Android APK. Push a tag like `v0.1.0` → GitHub Release with artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run for testing without cutting a release

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "val-market ${{ github.ref_name }}"
          releaseBody: "Unofficial fan tool. Not affiliated with or endorsed by Riot Games."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.0.12077973"

      - run: npm ci

      - name: Init + build Android APK (debug — installable without signing)
        run: |
          npx tauri android init
          npx tauri android build --apk --debug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk artifacts/val-market-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: val-market-android
          path: artifacts/

      - name: Attach to release (only on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/val-market-android-debug.apk
