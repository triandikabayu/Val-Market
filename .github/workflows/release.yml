name: Release

# Builds installers for macOS (Apple Silicon + Intel), Windows, Linux,
# and an Android APK. Push a tag like `v0.1.0` → GitHub Release with artifacts.
# Manual runs (workflow_dispatch) are for testing without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-arm
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macos-intel
            args: "--target x86_64-apple-darwin"
          # msi/deb/rpm bundle locally with zero tool downloads; NSIS and
          # AppImage need extra files from GitHub's CDN, which intermittently
          # 504s. Re-enable with `--bundles all` once the CDN behaves.
          - platform: windows-latest
            label: windows
            args: "--bundles msi"
          - platform: ubuntu-22.04
            label: linux
            args: "--bundles deb,rpm"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # tauri build downloads bundler tools (NSIS, AppRun, etc.) from GitHub's
      # CDN, which intermittently 504s — retry 3x before giving up
      - name: Build bundles (retry on CDN hiccups)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "== build attempt $attempt =="
            if npm run tauri build -- ${{ matrix.args }}; then
              exit 0
            fi
            echo "attempt $attempt failed, waiting before retry..."
            sleep 30
          done
          exit 1

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -v src-tauri/target/release/bundle/dmg/*.dmg artifacts/ || true
          cp -v src-tauri/target/release/bundle/msi/*.msi artifacts/ || true
          cp -v src-tauri/target/release/bundle/nsis/*.exe artifacts/ || true
          cp -v src-tauri/target/release/bundle/deb/*.deb artifacts/ || true
          cp -v src-tauri/target/release/bundle/rpm/*.rpm artifacts/ || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: val-market-${{ matrix.label }}
          path: artifacts/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.0.12077973"

      - name: Export NDK_HOME (required by Tauri)
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - run: npm ci

      - name: Init Android project
        run: npx tauri android init

      - name: Build Android APK (retry — gradle.org CDN occasionally 504s)
        run: |
          for attempt in 1 2 3; do
            echo "== gradle attempt $attempt =="
            if npx tauri android build --apk --debug; then
              exit 0
            fi
            echo "attempt $attempt failed, waiting before retry..."
            sleep 30
          done
          exit 1

      - name: Collect APK
        run: |
          mkdir -p artifacts
          echo "APKs found:"
          find gen/android -name '*.apk' -type f || true
          APK=$(find gen/android -name '*universal*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find gen/android -name '*.apk' -type f | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK produced — build outputs:"
            find gen/android/app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "Using: $APK"
          cp "$APK" artifacts/val-market-android-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: val-market-android
          path: artifacts/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
