name: Release

# Builds installers for macOS (Apple Silicon + Intel), Windows, Linux,
# and an Android APK. Push a tag like `v0.1.0` → GitHub Release with artifacts.
# Manual runs (workflow_dispatch) are for testing without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-arm
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macos-intel
            args: "--target x86_64-apple-darwin"
          # msi/deb/rpm bundle locally with zero tool downloads; NSIS and
          # AppImage need extra files from GitHub's CDN, which intermittently
          # 504s. Re-enable with `--bundles all` once the CDN behaves.
          - platform: windows-latest
            label: windows
            args: "--bundles msi"
          - platform: ubuntu-22.04
            label: linux
            args: "--bundles deb,rpm"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # tauri build downloads bundler tools (NSIS, AppRun, etc.) from GitHub's
      # CDN, which intermittently 504s — retry 3x before giving up
      - name: Build bundles (retry on CDN hiccups)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "== build attempt $attempt =="
            if npm run tauri build -- ${{ matrix.args }}; then
              exit 0
            fi
            echo "attempt $attempt failed, waiting before retry..."
            sleep 30
          done
          exit 1

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -v src-tauri/target/release/bundle/dmg/*.dmg artifacts/ || true
          cp -v src-tauri/target/release/bundle/msi/*.msi artifacts/ || true
          cp -v src-tauri/target/release/bundle/nsis/*.exe artifacts/ || true
          cp -v src-tauri/target/release/bundle/deb/*.deb artifacts/ || true
          cp -v src-tauri/target/release/bundle/rpm/*.rpm artifacts/ || true
          cp -v src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: val-market-${{ matrix.label }}
          path: artifacts/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.0.12077973"

      - name: Export NDK_HOME (required by Tauri)
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - run: npm ci

      - name: Init Android project
        run: npx tauri android init

      # The gradle wrapper downloads the distribution with a hard 10s timeout,
      # which fails for a 130MB zip. Prefetch it with curl (real retries +
      # generous timeout) and point the wrapper at the local file. If curl
      # itself keeps failing, at least raise the wrapper's timeout.
      - name: Prefetch Gradle distribution
        shell: bash
        run: |
          # ALWAYS raise the wrapper's download timeouts in the PROJECT
          # gradle.properties — the tauri CLI regenerates gradle-wrapper
          # properties on every build, so patching that file alone is not
          # durable. These properties are what the 10s default comes from.
          GRADLE_PROPS="src-tauri/gen/android/gradle.properties"
          grep -q "org.gradle.internal.http.socketTimeout" "$GRADLE_PROPS" 2>/dev/null || {
            echo "org.gradle.internal.http.connectionTimeout=120000" >> "$GRADLE_PROPS"
            echo "org.gradle.internal.http.socketTimeout=120000" >> "$GRADLE_PROPS"
          }

          PROPS="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          URL=$(grep '^distributionUrl' "$PROPS" | cut -d'=' -f2-)
          echo "distribution: $URL"
          mkdir -p src-tauri/gen/android/gradle-local
          ok=""
          for i in 1 2 3 4 5; do
            echo "== curl attempt $i =="
            if curl -L --fail --retry 2 --connect-timeout 20 --max-time 900 \
                 -o src-tauri/gen/android/gradle-local/gradle.zip "$URL"; then
              ok=1
              break
            fi
            sleep 20
          done
          if [ -n "$ok" ]; then
            sed -i "s|^distributionUrl=.*|distributionUrl=file:///${GITHUB_WORKSPACE}/src-tauri/gen/android/gradle-local/gradle.zip|" "$PROPS"
            echo "wrapper now uses the local zip:"
            grep distributionUrl "$PROPS"
          else
            echo "prefetch failed — relying on the 120s wrapper timeouts"
            grep distributionUrl "$PROPS"
          fi

      - name: Build Android APKs (release, split per ABI)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "== gradle attempt $attempt =="
            if npx tauri android build --apk --split-per-abi; then
              exit 0
            fi
            echo "attempt $attempt failed, waiting before retry..."
            sleep 30
          done
          exit 1

      # Release APKs must be signed to be installable; use a self-signed
      # keystore. ponytail: ephemeral keystore — installing a NEW release
      # later may require uninstalling the old app first (different key).
      # Commit a real keystore when distribution gets serious.
      - name: Sign + collect APKs
        shell: bash
        run: |
          KS="$HOME/.android/valmarket.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -alias valmarket \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass valmarket -keypass valmarket \
              -dname "CN=val-market"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -n 1)
          echo "using build-tools: $BT"
          mkdir -p artifacts
          echo "APKs found:"
          find src-tauri/gen/android -name '*.apk' -type f || true
          for APK in $(find src-tauri/gen/android -name '*.apk' -type f); do
            NAME=$(basename "$APK" .apk)
            case "$NAME" in
              *arm64-v8a*) LABEL="arm64-v8a";;
              *armeabi*)   LABEL="armeabi-v7a";;
              *x86_64*)    LABEL="x86_64";;
              *x86*)       LABEL="x86";;
              *)           LABEL="universal";;
            esac
            "$BT/zipalign" -f 4 "$APK" artifacts/tmp.apk
            "$BT/apksigner" sign --ks "$KS" --ks-pass pass:valmarket \
              --key-pass pass:valmarket \
              --out "artifacts/val-market-android-${LABEL}.apk" artifacts/tmp.apk
            "$BT/apksigner" verify "artifacts/val-market-android-${LABEL}.apk"
            rm -f artifacts/tmp.apk
          done
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: val-market-android
          path: artifacts/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
